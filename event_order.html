<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>실습 1: 스마트 피자 주문서</title>
    <link rel="stylesheet" href="basic_style.css">
    <style>
        /* 피자 주문서 전용 커스텀 스타일 스타일 */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            margin: 1.5rem 0;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            transition: all 0.2s;
        }
        .menu-item:hover {
            border-color: var(--primary);
            background: #f1f5f9;
        }
        .menu-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
        }
        .menu-info input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .menu-qty-wrap {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .menu-qty-wrap input[type="number"] {
            width: 60px;
            text-align: center;
            padding: 0.4rem;
        }
        .form-group {
            margin-bottom: 1.25rem;
        }
        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
        }
        .total-box {
            background: #edf2f7;
            padding: 1rem;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .total-box input {
            width: 150px;
            text-align: right;
            font-weight: bold;
            color: var(--primary-dark);
            border: none;
            background: transparent;
            font-size: 1.2rem;
            padding: 0;
        }
        .btn-group {
            display: flex;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }
        .btn-group button, .btn-group input[type="submit"], .btn-group input[type="reset"] {
            flex: 1;
            padding: 0.75rem;
            font-size: 1rem;
            cursor: pointer;
        }
        .btn-reset {
            background: #e2e8f0;
            color: #4a5568;
        }
        .btn-reset:hover {
            background: #cbd5e1;
        }
    </style>
    <script>
        /* 기능 1: 가격 계산 함수 */
        function recalc() {
            var total = 0; 
            var checks = document.getElementsByClassName("menu-check");
            var qtys = document.getElementsByClassName("menu-qty");

            for (var i = 0; i < checks.length; i++) {
                if (checks[i].checked) { 
                    var price = parseInt(checks[i].value);
                    var quantity = parseInt(qtys[i].value);
                    
                    if (isNaN(quantity) || quantity < 1) {
                        quantity = 1;
                    }
                    total += price * quantity;
                }
            }
            document.getElementById("total").value = total;
        }

        /* 기능 2: 주소 입력 확인 */
        function checkAddress() {
            var addr = document.getElementById("addr");
            if (addr.value == "") {
                alert("배달 받으실 주소를 반드시 입력해주세요!");
                addr.focus();
            }
        }

        /* 기능 3: 주문 전송 제어 */
        function validate(e) {
            var total = parseInt(document.getElementById("total").value);
            
            if (total == 0) {
                alert("상품을 적어도 하나는 선택해야 주문 가능합니다.");
                e.preventDefault(); 
                return false;
            }

            alert("주문이 완료되었습니다! (총 결제금액: " + total.toLocaleString() + "원)");
            e.preventDefault(); 
            return false; 
        }
    </script>
</head>
<body>
    <header>
        <h1>🍕 스마트 피자 주문</h1>
        <div class="subtitle">신선한 재료로 만든 피자를 집에서 만나보세요</div>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
    </nav>

    <main class="container">
        <form onsubmit="return validate(event)">
            <section>
                <h2>[메뉴 선택]</h2>
                <div class="menu-list">
                    <div class="menu-item">
                        <label class="menu-info">
                            <input type="checkbox" class="menu-check" value="15000" onchange="recalc()"> 
                            <span>콤비네이션 피자 (15,000원)</span>
                        </label>
                        <div class="menu-qty-wrap">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-info">
                            <input type="checkbox" class="menu-check" value="12000" onchange="recalc()"> 
                            <span>페퍼로니 피자 (12,000원)</span>
                        </label>
                        <div class="menu-qty-wrap">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-info">
                            <input type="checkbox" class="menu-check" value="2000" onchange="recalc()"> 
                            <span>치즈 토핑 추가 (2,000원)</span>
                        </label>
                        <div class="menu-qty-wrap">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                    <div class="menu-item">
                        <label class="menu-info">
                            <input type="checkbox" class="menu-check" value="1500" onchange="recalc()"> 
                            <span>콜라 1.25L (1,500원)</span>
                        </label>
                        <div class="menu-qty-wrap">
                            <input type="number" class="menu-qty" value="1" min="1" onchange="recalc()" onkeyup="recalc()"> 개
                        </div>
                    </div>
                </div>
            </section>

            <section class="form-group">
                <label for="addr">배달 주소</label>
                <input type="text" id="addr" onblur="checkAddress()" placeholder="배달 받으실 정확한 주소를 입력해주세요">
            </section>

            <section class="total-box">
                <span>주문 합계</span>
                <div>
                    <input type="text" id="total" value="0" readonly> 원
                </div>
            </section>

            <div class="btn-group">
                <input type="reset" class="btn-reset" value="초기화" onclick="setTimeout(recalc, 0)">
                <input type="submit" value="주문하기">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Smart Pizza. All rights reserved.</p>
    </footer>

    <script src="basic_script.js"></script>
</body>
</html>
